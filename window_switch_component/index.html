<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Window Switch Monitor</title>
</head>
<body>
<script>
(function () {
  let switchCount = 0;
  let resetToken = null;
  let initialized = false;
  let lastSwitchAt = 0;

  function postToStreamlit(type, extra) {
    window.parent.postMessage(
      Object.assign({
        isStreamlitMessage: true,
        type: type
      }, extra || {}),
      "*"
    );
  }

  function sendCount() {
    postToStreamlit("streamlit:setComponentValue", {
      value: switchCount,
      dataType: "json"
    });
  }

  function onRender(event) {
    const message = event.data || {};
    if (message.type !== "streamlit:render") return;

    const args = message.args || {};
    const incomingResetToken = args.reset_token;
    const incomingCount = Number(args.current_count || 0);

    if (!initialized || incomingResetToken !== resetToken) {
      resetToken = incomingResetToken;
      switchCount = incomingCount;
      initialized = true;
      lastSwitchAt = 0;
    } else {
      switchCount = Math.max(switchCount, incomingCount);
    }

    postToStreamlit("streamlit:setFrameHeight", { height: 0 });
  }

  function onVisibilityChange() {
    // The Page Visibility API follows the containing browser tab.
    // Do not use iframe "blur": normal clicks on Streamlit inputs can trigger it.
    if (!initialized || !document.hidden) return;

    const now = Date.now();

    // visibilitychange and browser lifecycle events can arrive close together.
    if (now - lastSwitchAt < 1500) return;

    lastSwitchAt = now;
    switchCount += 1;
    sendCount();
  }

  window.addEventListener("message", onRender);
  document.addEventListener("visibilitychange", onVisibilityChange);

  postToStreamlit("streamlit:componentReady", {
    apiVersion: 1
  });
})();
</script>
</body>
</html>
